<div class="content-grid">
  {% for item in include.grid_items %}
  <div class="content-grid__cell">
    {% if item.img %}
      <img src="{{ item.img | relative_url }}" alt="{{ item.alt }}" class="content-grid__img">
    {% endif %}
    
    {% if item.link %}
      {{ item.link | markdownify | replace: '<p>', '' | replace: '</p>', '' }}
    {% endif %}

    {% if item.text %}
      <p class="content-grid__caption">{{ item.text }}</p>
    {% endif %}
  </div>
  {% endfor %}
</div>
