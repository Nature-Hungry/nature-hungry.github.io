<style>
.lifeforms{
    display:flex;
    gap:2rem;
    flex-wrap: wrap;
}
.lifeform-group{
    text-align: center;
    width: fit-content;
    display:flex;
    flex-direction: column;
    gap:1rem;
    width: 200px;
}
.lifeform-image-group{
    display:grid;
    grid-template-columns: repeat(2, minmax(40px, 1fr));
    max-width: 200px;
    
}
.lifeform-image-group img{
    width:100%;
    aspect-ratio: 1;
    object-fit: cover;
    object-position: center;
}


.zones{
    display:flex;
    gap:1rem;
    align-items: center;
    justify-content: center;
    height: 300px;
    margin:2rem 0;
}
.zone{
    display:flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 220px;
    border:2px solid lightcoral;
    border-radius: 10px;
    padding-top:5%;
    padding-left:1rem;
    padding-right:1rem;
    padding-bottom:1rem;
    height: 100%;
}

.zone .icon{
    width:50px;
    aspect-ratio: 1;
    border:2px solid lightgrey;
    margin-bottom: 1rem;
}
</style>
<main class="page-content" id="main-content">

                <div class="icon"></div>
